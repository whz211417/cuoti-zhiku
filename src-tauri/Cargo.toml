[package]
name = "cuoti-zhiku"
version = "0.3.5"
description = "本地错题学习资料库"
authors = ["Codex"]
edition = "2021"

[lib]
name = "cuoti_zhiku_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.8.0", features = [] }
tauri-plugin-dialog = "2.2.0"
tauri-plugin-fs = "2.2.0"
tauri-plugin-os = "2.2.0"
tauri-plugin-store = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32.1", features = ["backup", "bundled"] }
base64 = "0.22.1"
sha2 = "0.10.9"
chrono = "0.4.39"
keyring = "4.1.5"
pdf-extract = "0.12.0"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3.15.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
