name: 功能建议
description: 提出一个能让真实学习流程更顺畅的改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 请勿附带真实题目、教材、资料库、备份文件或 API Key。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的学习问题
      description: 请描述任务和阻碍，而不只描述一个按钮。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你期待的体验
      description: 说明从开始到完成的步骤，以及什么结果代表它可用。
    validations:
      required: true
  - type: dropdown
    id: local_first
    attributes:
      label: 是否会涉及联网或 AI？
      options:
        - 不涉及，应完全本地可用
        - 可选联网，不应破坏本地流程
        - 尚不确定
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你目前怎样解决这个问题？
