name: Publish Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release version
        run: pnpm verify:release-version
      - name: Lint
        run: pnpm lint
      - name: Test frontend
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Test Rust core
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build signed app and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 错题智库 v__VERSION__
          releaseBody: 请先完成安装、启动、数据保留与应用内更新检查，再将此草稿发布给用户。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          updaterJsonPreferNsis: true

      - name: Publish stable Windows assets and updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced' }
          $signature = "$($installer.FullName).sig"
          if (-not (Test-Path -LiteralPath $signature)) { throw 'Updater signature was not produced' }

          $version = (Get-Content -Raw -LiteralPath 'package.json' | ConvertFrom-Json).version
          $assetName = "cuoti-zhiku_${version}_x64-setup.exe"
          $assetDirectory = Join-Path $env:RUNNER_TEMP 'cuoti-release-assets'
          [System.IO.Directory]::CreateDirectory($assetDirectory) | Out-Null
          $assetPath = Join-Path $assetDirectory $assetName
          $signaturePath = "$assetPath.sig"
          $checksumPath = "$assetPath.sha256"
          $manifestPath = Join-Path $assetDirectory 'latest.json'

          [System.IO.File]::Copy($installer.FullName, $assetPath, $true)
          [System.IO.File]::Copy($signature, $signaturePath, $true)
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText($checksumPath, "$hash  $assetName`n", $utf8)

          $downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$assetName"
          $manifest = [ordered]@{
            version = $version
            notes = '安全更新与体验改进。'
            pub_date = [DateTimeOffset]::UtcNow.ToString('o')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = ([System.IO.File]::ReadAllText($signaturePath)).Trim()
                url = $downloadUrl
              }
            }
          }
          [System.IO.File]::WriteAllText($manifestPath, ($manifest | ConvertTo-Json -Depth 5), $utf8)

          gh release upload $env:GITHUB_REF_NAME $assetPath $signaturePath $checksumPath $manifestPath --clobber

          $legacyPrefix = "_${version}_x64-setup"
          $releaseAssets = gh release view $env:GITHUB_REF_NAME --json assets | ConvertFrom-Json
          foreach ($asset in $releaseAssets.assets) {
            if ($asset.name.StartsWith($legacyPrefix)) {
              gh release delete-asset $env:GITHUB_REF_NAME $asset.name --yes
            }
          }
